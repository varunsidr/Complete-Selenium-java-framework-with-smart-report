name: Java CI Matrix

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
        include:
          - browser: chrome
            test_groups: smoke,api
          - browser: firefox
            test_groups: smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Compile
        run: ./mvnw -B -ntp -DskipTests compile

      - name: Run TestNG suite on ${{ matrix.browser }}
        run: ./mvnw -B -ntp test -Dgroups=${{ matrix.test_groups }} -Dbrowser=${{ matrix.browser }} -Dheadless=true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ matrix.browser }}
          if-no-files-found: ignore
          path: |
            target/surefire-reports/**
            test-output/**
            reports/**
            logs/**
